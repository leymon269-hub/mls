<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1c1b2e">
<title>Vice-Versa</title>
<style>
  :root { --accent:#ff9fb7; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:20px; color:#fff; text-align:center;
    font-family:Georgia,"Times New Roman",serif;
  }
  /* Fond : voile sombre + photo fond.jpg + dégradé de secours si la photo est absente */
  body::before {
    content:""; position:fixed; inset:0; z-index:-1;
    background:
      linear-gradient(rgba(20,16,40,.55), rgba(20,16,40,.8)),
      url("fond.jpg") center / cover no-repeat,
      linear-gradient(160deg,#2b2350,#1c1b2e 60%,#3a2347);
  }
  .carte {
    width:100%; max-width:560px; padding:30px 20px 24px; border-radius:22px;
    background:rgba(255,255,255,.10);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 20px 50px rgba(0,0,0,.35);
    animation:apparition 1s ease both;
  }
  .emoji { font-size:2.8rem; margin-bottom:6px; }
  h1 { font-weight:normal; font-size:1.8rem; margin:0 0 6px; color:var(--accent); letter-spacing:.5px; }
  .sous { font-style:italic; opacity:.88; margin:0 0 22px; font-size:1.02rem; }
  .cadre {
    width:100%; aspect-ratio:16/9; border-radius:14px; overflow:hidden;
    background:rgba(0,0,0,.35); box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  iframe { width:100%; height:100%; border:0; }
  .bientot { padding:34px 10px; opacity:.9; }
  @keyframes apparition { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
</style>
</head>
<body>
<div class="carte" id="contenu"></div>

<script>
// === A MODIFIER : remplace les identifiants YouTube par les tiens ===
const VIDEOS = {
  joie:      ["IDENTIFIANT_1"],
  amour:     ["IDENTIFIANT_1"],
  tristesse: ["IDENTIFIANT_1"],
  stress:    ["IDENTIFIANT_1"],
  doute:     ["IDENTIFIANT_1"],
  sommeil:   ["IDENTIFIANT_1"],
  colere:    ["IDENTIFIANT_1"]
};
// ====================================================================

const THEMES = {
  joie:      { emoji:"😄", titre:"Pour sourire",    sous:"Un petit moment de légèreté.",             couleur:"#ffd36e" },
  amour:     { emoji:"💗", titre:"Pour toi",        sous:"Rien que pour toi.",                     couleur:"#ff9fb7" },
  tristesse: { emoji:"🫂", titre:"Je suis là",      sous:"Prends ton temps.",                      couleur:"#9ec5ff" },
  stress:    { emoji:"🌿", titre:"Une pause",       sous:"Respire. Une chose à la fois.",         couleur:"#9fe0b8" },
  doute:     { emoji:"✨", titre:"Ce que je vois",  sous:"Fais confiance à mon regard.",          couleur:"#d2b4ff" },
  sommeil:   { emoji:"🌙", titre:"Bonne nuit",      sous:"Ferme les yeux et laisse-toi bercer.",   couleur:"#a8b4ff" },
  colere:    { emoji:"🔥", titre:"Respire",         sous:"Tu as le droit d’être à cran.",        couleur:"#ff9d7a" }
};

const e = new URLSearchParams(location.search).get("e");
const theme = THEMES[e];
const liste = VIDEOS[e];
const carte = document.getElementById("contenu");

if (!theme || !liste) {
  carte.innerHTML =
    '<div class="emoji">💌</div><h1>Vice-Versa</h1>' +
    '<p class="sous">Scanne le QR code d’une enveloppe.</p>';
} else {
  document.documentElement.style.setProperty("--accent", theme.couleur);
  let html =
    '<div class="emoji">' + theme.emoji + '</div>' +
    '<h1>' + theme.titre + '</h1>' +
    '<p class="sous">' + theme.sous + '</p>';

  const valides = liste.filter(v => v && !v.startsWith("IDENTIFIANT"));
  if (valides.length === 0) {
    html += '<div class="bientot">La vidéo arrive bientôt 💌</div>';
  } else {
    const cle = "derniere_" + e;   // mémorisé uniquement sur son téléphone
    let derniere = null;
    try { derniere = localStorage.getItem(cle); } catch (_) {}
    let choix = valides;
    if (valides.length > 1) choix = valides.filter(v => v !== derniere);
    const video = choix[Math.floor(Math.random() * choix.length)];
    try { localStorage.setItem(cle, video); } catch (_) {}
    html +=
      '<div class="cadre"><iframe title="Vidéo" ' +
      'src="https://www.youtube-nocookie.com/embed/' + video + '?rel=0" ' +
      'allow="autoplay; encrypted-media" allowfullscreen></iframe></div>';
  }
  carte.innerHTML = html;
}
</script>
</body>
</html>
